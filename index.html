<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Photo Gallery</title>
    <style>
        /* Creates the wooden frame border around the edge of the window */
        html {
            border: 20px solid #5c4033; /* Dark wood color */
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Clean, non-distracting matte background color */
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background: #e2d4c9; /* Matte warm-sand beige */
            padding: 20px; 
            margin: 0; 
        }
        
        /* Spruced-up Title Styling */
        h1 { 
            font-family: "Georgia", "Times New Roman", serif; 
            color: #3a261c; 
            font-size: 2.8rem; 
            font-weight: 700; 
            letter-spacing: 1px; 
            margin-top: 20px;
            margin-bottom: 40px; 
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6); 
        }
        
        /* Fixed Grid Layout - Keeps your 4 active cards perfectly aligned */
        .gallery { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 25px; 
            max-width: 900px; 
            margin: 0 auto; 
            justify-items: center;
        }
        
        /* Image Wrapper (Width locked to exactly 420px for structural symmetry) */
        .gallery a {
            position: relative;
            width: 420px;
            display: block;
            text-decoration: none;
            overflow: hidden;
            border: 6px solid #5c4033; /* Wooden border moved to wrapper */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        /* Subtle wrapper lift effect on hover */
        .gallery a:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); 
        }
        
        /* Image Styling */
        img { 
            width: 100%; 
            height: auto; 
            display: block;
            cursor: zoom-in;
        }
        
        /* The Text Overlay Sheet */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92); /* White sheet texture with slight transparency */
            color: #3a261c; /* Text matching your title wood color */
            font-family: "Georgia", serif;
            font-size: 2.2rem; /* Slightly larger text to match the larger cards */
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease; /* Smooth fade effect */
            pointer-events: none; /* Passes the mouse click down to the underlying link */
            box-sizing: border-box;
            padding: 20px;
        }

        /* Fades out the white text sheet when the user hovers over the image block */
        .gallery a:hover .overlay {
            opacity: 0;
        }
    </style>
</head>
<body>

    <h1>Eastern Suffolk Schedules</h1>

    <!-- MAIN ACTIVE IMAGES -->
    <div class="gallery">
        <!-- Image 1 with Text Sheet Overlay -->
        <a href="image1.jpg" target="_blank">
            <img src="image1.jpg" alt="Photo 1">
            <div class="overlay">Sept 20-26</div>
        </a>

        <!-- Image 2 with Text Sheet Overlay -->
        <a href="image2.jpg" target="_blank">
            <img src="image2.jpg" alt="Photo 2">
            <div class="overlay">Sept 27-Oct 3</div>
        </a>

        <!-- Image 3 -->
        <a href="image3.jpg" target="_blank">
            <img src="image3.jpg" alt="Photo 3">
            <div class="overlay">Oct 4-10</div>
        </a>

        <!-- Image 4 with custom text requested -->
        <a href="image4.jpg" target="_blank">
            <img src="image4.jpg" alt="Photo 4">
            <div class="overlay">OT Report</div>
        </a>
    </div> 

    <!-- Center-aligned section breaker -->
    <hr style="border: 0; border-top: 2px dashed #3a261c; margin: 60px auto; max-width: 500px; opacity: 0.4;">

    <!-- ==================== IMAGE HISTORY SECTION START ==================== -->
    
    <!-- Centered Header Container -->
    <div style="text-align: center; margin-bottom: 30px; font-family: sans-serif;">
        <h2 style="color: #3a261c; margin-bottom: 8px; font-family: 'Georgia', serif; font-size: 2rem;">📅 Previous Weekly Schedules</h2>
        <p style="color: #5c4033; font-size: 14px; margin-top: 0; font-style: italic;">Click on any past date range to view or download that week's schedule.</p>
    </div>

    <!-- History Links List Layout -->
    <div class="history-list" style="font-family: sans-serif; line-height: 1.6; max-width: 500px; margin: 0 auto 50px auto; padding: 0 10px;">
        
        <!-- WEEKLY ARCHIVE ENTRY (Copy & paste this block at the top of the list every week) -->
        <div class="history-item" style="margin-bottom: 15px; padding: 12px 10px; border-bottom: 1px solid rgba(92, 64, 51, 0.3); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; color: #3a261c; font-family: 'Georgia', serif; font-size: 1.1rem;">Sept 13-19:</span>

            <span style="font-weight: bold; color: #3a261c; font-family: 'Georgia', serif; font-size: 1.1rem;">Not Available:</span>

</body>
</html>
